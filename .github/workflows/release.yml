name: Release

# Tagging is what publishes: v* pushes build the archives, verify them and
# attach them to a GitHub Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # Nothing is published unless the tagged revision passes the same checks CI
  # runs, so a tag can never produce a broken release.
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./... -count=1

  release:
    name: publish ${{ github.ref_name }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: build the archives
        run: ./scripts/build-release.sh "${GITHUB_REF_NAME}"

      - name: verify the checksums
        run: cd dist && sha256sum -c SHA256SUMS

      # Proves the archive layout and that -ldflags really stamped the tag.
      - name: smoke test a stamped binary
        run: |
          set -euo pipefail
          tar -xzf "dist/lsm_${GITHUB_REF_NAME}_linux_amd64.tar.gz" -C /tmp
          binary="/tmp/lsm_${GITHUB_REF_NAME}_linux_amd64/lsm"
          stamp="$("$binary" version)"
          echo "$stamp"
          case "$stamp" in
            *"${GITHUB_REF_NAME}"*) ;;
            *) echo "the version stamp is missing the tag"; exit 1 ;;
          esac
          "$binary" --help > /dev/null

      - name: publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
