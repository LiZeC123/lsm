name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Keep the test output readable and make failures fail fast.
  GOFLAGS: -trimpath

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      # TEMPORARY diagnostic split: one step per package, each with
      # `if: always()`, so the CI status API (the only thing readable without
      # repo admin) reveals *every* failing package per OS in a single run.
      # Collapse back into `go test ./...` once green.
      - name: go test (internal/config)
        if: always()
        run: go test ./internal/config -count=1
      - name: go test (internal/errs)
        if: always()
        run: go test ./internal/errs -count=1
      - name: go test (internal/fsx)
        if: always()
        run: go test ./internal/fsx -count=1
      - name: go test (internal/process)
        if: always()
        run: go test ./internal/process -count=1
      - name: go test (internal/service)
        if: always()
        run: go test ./internal/service -count=1
      - name: go test (internal/ui)
        if: always()
        run: go test ./internal/ui -count=1
      - name: go test (cmd)
        if: always()
        run: go test ./cmd -count=1
      - name: go test (tests)
        if: always()
        run: go test ./tests -count=1

      - name: go build
        run: go build ./...

  race:
    name: race detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race ./... -count=1

  formatting:
    name: formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

  cross:
    name: cross compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: build every supported target
        run: |
          set -euo pipefail
          for goos in linux darwin windows; do
            for goarch in amd64 arm64; do
              echo "==> $goos/$goarch"
              GOOS="$goos" GOARCH="$goarch" go build -o /dev/null .
            done
          done

  # TEMPORARY probe: one job per suspect test so the job *name* itself reports
  # which assertion fails on Windows. GitHub only exposes step conclusions
  # without repo admin rights, so this is how the failure is localised.
  probe-windows:
    name: probe ${{ matrix.test }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - pkg: ./internal/config
            test: TestLoadMissingFileYieldsAnEmptyConfig
          - pkg: ./internal/config
            test: TestSaveLoadRoundTripKeepsTrickyCommands
          - pkg: ./internal/config
            test: TestSaveIsDeterministicAndSorted
          - pkg: ./internal/config
            test: TestSaveUsesTwoSpaceIndentation
          - pkg: ./internal/config
            test: TestSaveCreatesTheDirectoryAndLeavesNoTemporaryFiles
          - pkg: ./internal/config
            test: TestSavePreservesTheModeOfAnExistingConfig
          - pkg: ./internal/config
            test: TestSaveRejectsAnInvalidConfigWithoutTouchingTheFile
          - pkg: ./internal/config
            test: TestLoadReportsYAMLSyntaxErrors
          - pkg: ./internal/config
            test: TestLoadValidatesSchema
          - pkg: ./internal/config
            test: TestLoadAcceptsAServiceWhoseWorkDirIsGone
          - pkg: ./internal/config
            test: TestCheckWorkDir
          - pkg: ./internal/config
            test: TestLoadToleratesAnEmptyDocument
          - pkg: ./internal/config
            test: TestNamesIsSorted
          - pkg: ./internal/config
            test: TestValidName
          - pkg: ./internal/process
            test: TestLaunchAndStopLifecycle
          - pkg: ./internal/process
            test: TestLaunchReportsACommandThatCannotRun
          - pkg: ./internal/process
            test: TestStopReportsAnAlreadyDeadProcess
          - pkg: ./internal/process
            test: TestStartedBeforeNeedsATimestamp
          - pkg: ./internal/process
            test: TestIsAliveRejectsNonPositivePIDs
          - pkg: ./internal/process
            test: TestStopRejectsAnInvalidPID
          - pkg: ./internal/process
            test: TestPIDFileRoundTrip
          - pkg: ./internal/process
            test: TestWritePIDFileCreatesAPrivateRunDirectory
          - pkg: ./internal/process
            test: TestReadPIDFileMissingIsNotAnError
          - pkg: ./internal/process
            test: TestReadPIDFileRejectsBrokenContent
          - pkg: ./internal/process
            test: TestRemovePIDFileToleratesAMissingFile
          - pkg: ./internal/process
            test: TestUptime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: run one test
        shell: bash
        run: go test ${{ matrix.pkg }} -run '^${{ matrix.test }}$' -count=1 -v
