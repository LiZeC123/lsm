name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Keep the test output readable and make failures fail fast.
  GOFLAGS: -trimpath

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      # TEMPORARY diagnostic split: one step per package so the CI status API
      # (the only thing readable without repo admin) reveals which package
      # fails on which OS. Collapse back into `go test ./...` once green.
      - name: go test (internal/config)
        run: go test ./internal/config -count=1
      - name: go test (internal/errs)
        run: go test ./internal/errs -count=1
      - name: go test (internal/fsx)
        run: go test ./internal/fsx -count=1
      - name: go test (internal/process)
        run: go test ./internal/process -count=1
      - name: go test (internal/service)
        run: go test ./internal/service -count=1
      - name: go test (internal/ui)
        run: go test ./internal/ui -count=1
      - name: go test (cmd)
        run: go test ./cmd -count=1
      - name: go test (tests)
        run: go test ./tests -count=1

      - name: go build
        run: go build ./...

  race:
    name: race detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race ./... -count=1

  formatting:
    name: formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

  cross:
    name: cross compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: build every supported target
        run: |
          set -euo pipefail
          for goos in linux darwin windows; do
            for goarch in amd64 arm64; do
              echo "==> $goos/$goarch"
              GOOS="$goos" GOARCH="$goarch" go build -o /dev/null .
            done
          done
