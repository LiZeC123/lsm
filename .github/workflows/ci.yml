name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same branch supersedes the run in flight instead of
# queueing behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Reproducible builds: no local paths are baked into the binaries.
  GOFLAGS: -trimpath

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    # A hung test must not burn the six hour default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      # This includes the tests/ integration suite, which builds the binary and
      # exercises add / list / start / ps / restart / stop / del against real
      # processes (dev.md §10.2).
      - name: go test
        run: go test ./... -count=1

      - name: go build
        run: go build ./...

  race:
    name: race detector
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race ./... -count=1

  formatting:
    name: formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

  cross:
    name: cross compile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: build every supported target
        run: |
          set -euo pipefail
          for goos in linux darwin windows; do
            for goarch in amd64 arm64; do
              echo "==> $goos/$goarch"
              GOOS="$goos" GOARCH="$goarch" go build -o /dev/null .
            done
          done
